name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Web Build Check
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Next.js build
        run: npm run build

  agent-check:
    name: Python Agent Syntax Check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python compile check
        run: |
          python -m py_compile $(find backend livekit-agents -name "*.py" 2>/dev/null)
